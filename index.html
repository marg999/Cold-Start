            <div class="bar"><i style="width:${val*100}%;background:${condColor(val)}"></i></div></div>
            ${val<.9&&canEdit?`<button class="btn sm rep" data-act="repair" data-id="${car.uid}" data-k="${k}" ${bayFree?'':'disabled'}><span>Réparer ${eur(repairCost(car,k))}</span><small>${Math.round(repairTime(car,k)/1000)} s · valeur +${eur(gain)}</small></button>`:`<span class="comp-ok">${val>=.9?'Bon état':''}</span>`}</div>`}).join('')}</div>
        ${canEdit&&needsRepair(car)&&!bayFree?`<p class="meta small">Tous les ponts sont occupés.</p>`:car.status==='vente'&&needsRepair(car)?`<p class="meta small">Pendant la réparation, elle quitte le showroom puis y revient au même prix.</p>`:''}
      </section>
      <section class="fcol"><h4>Prix de vente</h4>
        <div class="kv"><span>Payé et frais</span><b class="num">${eur(car.paid+car.spent)}</b><span>Cote des ${TYPE_LABEL[m.type]}</span><b class="num" style="color:${fx>0?'var(--good)':fx<0?'var(--bad)':'var(--fg)'}">${fx>0?'+':fx<0?'−':''}${Math.abs(fx)} %</b><span>Prix conseillé</span><b class="num">${eur(suggested(car))}</b></div>
        ${canEdit?`<div class="row"><label class="field" for="ask-${car.uid}"><input id="ask-${car.uid}" data-draft="ask-${car.uid}" inputmode="numeric" value="${esc(String(p))}" aria-label="Prix de vente"><span>€</span></label><button class="btn ghost sm" data-act="suggest" data-id="${car.uid}">Prix conseillé</button></div>
        <div id="gauge-${car.uid}">${gaugeInner(car,p)}</div>
        <div class="row">${car.status==='vente'?`<button class="btn main" data-act="list" data-id="${car.uid}">Changer le prix</button><button class="btn ghost" data-act="unlist" data-id="${car.uid}">Retirer de la vente</button>`:`<button class="btn main" data-act="list" data-id="${car.uid}">Mettre en vente</button>`}</div>`
        :`<p class="meta">Le prix pourra être fixé à la fin de la réparation.</p>`}
      </section>
    </div>
  </div></div>`;
}

function renderModal(){
  const m=document.getElementById('modal');
  if(mapOpen){ m.innerHTML=mapHTML(); return; }
  if(auction){
    const a=auction, car=a.carCache, left=a.endsAt-now(), next=a.leader?a.price+stepOf(a.price):a.price;
    m.innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-label="Enchère">
      ${stage(car,{num:a.lotId,tagR:a.done?'Adjugé':'En cours'})}
      <div class="inner">${head(car)}
      ${a.done?(a.result==='win'?`<div class="quote">Adjugée pour ${eur(a.price)}. Elle vous attend sur le parking.</div>`
        :`<div class="quote">${a.leader==='rival'?`Adjugée à ${esc(a.rival)} pour ${eur(a.price)}.`:'Aucune offre, le lot est retiré.'}</div>`)
        +`<div class="row">${a.result==='win'?`<button class="btn main" data-act="ficheFromAuction" data-id="${car.uid}">Ouvrir la fiche</button>`:''}<button class="btn ${a.result==='win'?'':'main'}" data-act="closeModal">Fermer</button></div>`
      :`<div class="row" style="justify-content:space-between;align-items:flex-end">
          <div><div class="meta">Enchère actuelle</div><div class="bigprice num">${eur(a.price)}</div></div>
          <div style="text-align:right"><div class="meta">Clôture</div><div class="timer num ${left<4000?'hot':''}">${mmss(left)}</div></div></div>
        <div class="leader">${a.leader==='player'?'<b>Vous menez l’enchère.</b>':a.leader==='rival'?`<b>${esc(a.rival)}</b> mène l'enchère.`:'Aucune offre pour l’instant.'}</div>
        <div class="row"><button class="btn main" data-act="playerBid" ${a.leader==='player'||next>S.money?'disabled':''}>Enchérir à ${eur(next)}</button>
        <button class="btn ghost" data-act="leaveAuction" ${a.leader==='player'?'disabled':''}>Quitter la salle</button></div>
        <div class="meta">Trésorerie : ${eur(S.money)}</div>`}
      </div></div></div>`;
    return;
  }
  if(fb.conflict){
    const c=fb.conflict;
    m.innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-label="Choisir la partie"><div class="inner">
      <div class="quote" style="font-style:normal">Deux parties trouvées</div>
      <p class="meta" style="margin:0">Ce compte a déjà une partie en ligne, et vous avez aussi une partie sur cet appareil. Laquelle garder ? L'autre sera remplacée.</p>
      <div class="cols">
        <div class="panel glass"><h3>En ligne</h3><div class="kv"><span>Garage</span><b>${esc(c.garage)}</b><span>Niveau</span><b>${c.level}${c.level>=6&&c.star?'.'+c.star:''}</b><span>Trésorerie</span><b class="num">${eur(c.money)}</b><span>Ventes</span><b class="num">${c.stats.sold}</b></div>
          <button class="btn main" style="margin-top:12px" data-act="keepCloud">Garder celle-ci</button></div>
        <div class="panel glass"><h3>Cet appareil</h3><div class="kv"><span>Garage</span><b>${esc(S.garage)}</b><span>Niveau</span><b>${lvlNum()}</b><span>Trésorerie</span><b class="num">${eur(S.money)}</b><span>Ventes</span><b class="num">${S.stats.sold}</b></div>
          <button class="btn main" style="margin-top:12px" data-act="keepLocal">Garder celle-ci</button></div>
      </div></div></div></div>`;
    return;
  }
  if(acct){
    const md=acct.mode;
    m.innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-label="Compte"><form class="inner" id="acct-form" novalidate>
      <div class="quote" style="font-style:normal">${md==='signup'?'Créer un compte':md==='reset'?'Mot de passe oublié':'Se connecter'}</div>
      <p class="meta" style="margin:0">${md==='signup'?'Votre partie en cours sera gardée et sauvegardée en ligne.':md==='reset'?'Indiquez votre adresse, vous recevrez un lien pour choisir un nouveau mot de passe.':'Retrouvez votre garage sur tous vos appareils.'}</p>
      ${md==='signup'?`<label class="fld" for="acct-pseudo"><span>Pseudo (visible au classement)</span><input id="acct-pseudo" data-draft="acct-pseudo" maxlength="20" autocomplete="nickname" value="${esc(drafts['acct-pseudo']||'')}"></label>`:''}
      <label class="fld" for="acct-email"><span>Adresse e-mail</span><input id="acct-email" data-draft="acct-email" type="email" autocomplete="email" value="${esc(drafts['acct-email']||'')}"></label>
      ${md!=='reset'?`<label class="fld" for="acct-pass"><span>Mot de passe${md==='signup'?' (6 caractères minimum)':''}</span><input id="acct-pass" data-draft="acct-pass" type="password" autocomplete="${md==='signup'?'new-password':'current-password'}" value="${esc(drafts['acct-pass']||'')}"></label>`:''}
      ${acct.error?`<div class="unknown warn">${esc(acct.error)}</div>`:''}${acct.info?`<div class="unknown ok">${esc(acct.info)}</div>`:''}
      <div class="row"><button class="btn main" type="submit" ${acct.busy?'disabled':''}>${acct.busy?'Patientez…':md==='signup'?'Créer mon compte':md==='reset'?'Envoyer le lien':'Se connecter'}</button>
        <button class="btn ghost" type="button" data-act="acctClose">Annuler</button></div>
      <div class="row" style="gap:4px 16px">${md!=='login'?`<button class="btn ghost" type="button" data-act="acctMode" data-id="login">J'ai déjà un compte</button>`:`<button class="btn ghost" type="button" data-act="acctMode" data-id="signup">Créer un compte</button><button class="btn ghost" type="button" data-act="acctMode" data-id="reset">Mot de passe oublié</button>`}</div>
    </form></div></div>`;
    return;
  }
  if(recruit){
    const r=recruit, list=S.candidates.filter(c=>c.role===r);
    m.innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-label="Recrutement"><div class="inner">
      <div class="quote" style="font-style:normal">Recruter : ${ROLES[r].label.toLowerCase()}</div>
      <p class="meta" style="margin:0">${ROLES[r].desc} L'embauche coûte une prime d'un demi-salaire. Nouvelles candidatures dans <span class="num" data-ends="${S.nextCandAt}">${mmss(S.nextCandAt-now())}</span>.</p>
      ${list.length?`<div class="cands">${list.map(c=>`<div class="cand">${portrait(empSrc(c.role,c.look),'face',c.name)}<div style="flex:1;min-width:0"><b>${esc(c.name)}</b>${stars(c.skill)}<small class="meta">${eur(c.salary)} par mois · prime ${eur(Math.round(c.salary*.5))}</small></div><button class="btn main" data-act="hireOpen" data-id="${c.id}">Choisir</button></div>`).join('')}</div>`
        :'<p class="meta">Aucune candidature pour ce poste ce mois-ci.</p>'}
      <div class="row"><button class="btn ghost" data-act="recruitClose">Annuler</button></div>
    </div></div></div>`;
    return;
  }
  if(hiring){
    const c=S.candidates.find(x=>x.id===hiring);
    if(!c){hiring=null; m.innerHTML=''; return;}
    const sel=drafts.look??c.look, fee=Math.round(c.salary*.5);
    m.innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-label="Recrutement"><div class="inner">
      <div class="row" style="gap:16px">${portrait(empSrc(c.role,sel),'face lg',c.name)}<div><span class="eyebrow">${ROLES[c.role].label}</span>
        <div class="quote" style="font-style:normal">${esc(nameFor(c,sel))}</div>${stars(c.skill)}</div></div>
      <div><div class="meta" style="margin-bottom:8px">Choisissez son apparence</div>
        <div class="looks">${[1,2,3,4].map(n=>`<button class="look" data-act="look" data-id="${n}" aria-pressed="${sel===n}" aria-label="Apparence ${n}"><img src="${empSrc(c.role,n)}" alt="" onerror="this.onerror=null;this.src=SIL"></button>`).join('')}</div></div>
      <div class="kv"><span>Salaire</span><b class="num">${eur(c.salary)} / mois</b><span>Prime d'embauche</span><b class="num">${eur(fee)}</b></div>
      <div class="row"><button class="btn main" data-act="hire" data-id="${c.id}" ${S.money<fee?'disabled':''}>Embaucher</button><button class="btn ghost" data-act="hireClose" data-id="${c.role}">Retour</button></div>
    </div></div></div>`;
    return;
  }
  if(nego){
    const c=S.clients.find(x=>x.id===nego.clientId), car=nego.carCache;
    m.innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-label="Négociation">
      <div class="lounge"><div class="who"><small>${PERSONAS[nego.persona].label}</small>${esc(nego.name)}</div></div>
      <div class="inner">
      <div class="quote">« ${esc(nego.msg)} »</div>
      <div class="meta">${carName(car)} · ${car.color.n} · affichée ${eur(car.ask)} · valeur estimée ${eur(valueOf(car))}</div>
      ${nego.done?(nego.result==='sold'?`<div class="kv"><span>Prix de vente</span><b class="num">${eur(nego.price)}</b><span>Marge</span><b class="num" style="color:${nego.profit>=0?'var(--good)':'var(--bad)'}">${eur(nego.profit)}</b></div>`
        +(nego.trade?`<div class="tradein"><div class="meta" style="margin-bottom:6px">« Vous me reprenez ma voiture ? Je vous la laisse pour ${eur(nego.trade.price)}. »</div>
          <div class="card glass">${stage(nego.trade.car)}<div class="body">${head(nego.trade.car,`<span class="price num">${eur(nego.trade.price)}</span>`)}${condsHTML(nego.trade.car)}<div class="meta">Valeur estimée <b class="num" style="color:var(--fg)">${eur(valueOf(nego.trade.car))}</b></div>
          <div class="row"><button class="btn main" data-act="tradeAccept">Reprendre pour ${eur(nego.trade.price)}</button><button class="btn ghost" data-act="tradeRefuse">Refuser la reprise</button></div></div></div></div>`
          :nego.tradeDone==='ok'?`<div class="meta">Reprise faite, la voiture est sur votre parking.</div>`:''):'')
        +(nego.trade?'':`<div class="row"><button class="btn main" data-act="closeModal">Fermer</button></div>`)
      :`<div class="row" style="justify-content:space-between"><span class="meta">Offre du client <b class="num" style="color:var(--fg)">${eur(c.offer)}</b></span>
          <span class="row"><span class="meta">Patience</span><span class="patience">${Array.from({length:c.patienceMax},(_,i)=>`<i class="${i<c.patience?'on':''}"></i>`).join('')}</span></span></div>
        <div class="row"><button class="btn main" data-act="negoAccept">Accepter ${eur(c.offer)}</button></div>
        <div class="row"><label class="field" for="counter"><input id="counter" data-draft="counter" inputmode="numeric" value="${esc(drafts.counter||'')}" aria-label="Contre-proposition"><span>€</span></label>
          <button class="btn" data-act="negoCounter">Contre-proposer</button></div>
        <div class="row"><button class="btn" data-act="negoCafe" ${c.coffee?'disabled':''}>${c.coffee?'Café offert':`Offrir un café <small>${has('cafe')?'offert':'5 €'}</small>`}</button>
          <button class="btn" data-act="negoEssai" ${c.essai?'disabled':''}>${c.essai?'Essai fait':'Proposer un essai'}</button>
          <button class="btn" data-act="negoGeste" ${nego.geste?'disabled':''}>Garantie 6 mois <small>400 €</small></button>
          <button class="btn ghost danger" data-act="negoDismiss">Congédier</button></div>`}
      </div></div></div>`;
    return;
  }
  if(fiche){
    const car=S.cars.find(c=>c.uid===fiche);
    if(car){ m.innerHTML=ficheHTML(car); return; }
    fiche=null;
  }
  m.innerHTML='';
}

function updateLive(){
  document.querySelectorAll('[data-ends]').forEach(el=>el.textContent=mmss(+el.dataset.ends-now()));
  document.querySelectorAll('[data-pend]').forEach(el=>{const s=+el.dataset.start,e=+el.dataset.pend;el.style.width=clamp((now()-s)/(e-s),0,1)*100+'%'});
}
// notification, avec un bouton d'action quand c'est utile
function toast(t,kind,action){
  const box=document.getElementById('toasts'), el=document.createElement('div');
  el.className='toast '+(kind||'');
  const sp=document.createElement('span'); sp.textContent=t; el.appendChild(sp);
  if(action){ const b=document.createElement('button'); b.className='btn sm tbtn'; b.textContent=action.label; b.dataset.act=action.act; if(action.id!=null) b.dataset.id=action.id; el.appendChild(b); }
  box.appendChild(el);
  setTimeout(()=>el.remove(),action?7000:4200); while(box.children.length>3)box.firstChild.remove();
}

document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.draft; if(!k) return;
  drafts[k]=e.target.value;
  if(k.startsWith('ask-')){ const uid=+k.slice(4), car=S.cars.find(c=>c.uid===uid);
    if(car) gaugeUpdate(car,parseInt(String(e.target.value).replace(/\D/g,''),10)||0,false); }
});
document.addEventListener('input',e=>{
  const uid=e.target.dataset&&e.target.dataset.slide; if(uid==null) return;
  const car=S.cars.find(c=>c.uid===+uid); if(!car) return;
  const p=posToPrice(car,(+e.target.value)/1000);
  drafts['ask-'+uid]=String(p);
  const inp=document.getElementById('ask-'+uid); if(inp) inp.value=String(p);
  gaugeUpdate(car,p,true);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='counter')negoCounter();
  if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('ask-')) listCar(+e.target.id.slice(4)), fiche&&renderModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"][data-act]')){ e.preventDefault(); e.target.click(); }
  if(e.key==='Escape'){ if(mapOpen){mapOpen=false;renderModal();} else if(todoOpen){todoOpen=false;render();} else if(fiche){fiche=null;renderModal();} }
});
document.addEventListener('submit',e=>{if(e.target.id==='acct-form'){e.preventDefault();acctSubmit();}});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled)return;
  const id=b.dataset.id, n=+id;
  if(b.classList.contains('tbtn')){ const t=b.closest('.toast'); if(t) t.remove(); }
  const refreshFiche=()=>{ if(fiche) renderModal(); };
  switch(b.dataset.act){
    case 'tab': S.tab=id; todoOpen=false; save(); render(); window.scrollTo({top:Math.min(window.scrollY,document.querySelector('nav').offsetTop)}); break;
    case 'todoOpen': todoOpen=!todoOpen; render(); break;
    case 'mapOpen': mapOpen=true; todoOpen=false; drafts.mapSel=S.city; render(); renderModal(); break;
    case 'mapClose': mapOpen=false; delete drafts.confirmCity; renderModal(); break;
    case 'mapSel': e.preventDefault(); drafts.mapSel=id; renderModal(); { const el=document.getElementById('city-'+id); if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'}); } break;
    case 'cityAsk': drafts.confirmCity=id; drafts.mapSel=id; renderModal(); break;
    case 'cityNo': delete drafts.confirmCity; renderModal(); break;
    case 'goCity': goCity(id); break;
    case 'todoClose': todoOpen=false; render(); break;
    case 'fiche': fiche=n; todoOpen=false; render(); renderModal(); break;
    case 'ficheClose': fiche=null; renderModal(); break;
    case 'ficheFromAuction': auction=null; fiche=n; renderModal(); render(); break;
    case 'suggest': { const car=S.cars.find(c=>c.uid===n); if(car){ drafts['ask-'+n]=String(suggested(car)); renderModal(); } break; }
    case 'inspect': inspect(n); break;
    case 'bid': startAuction(n); break;
    case 'playerBid': playerBid(); break;
    case 'leaveAuction': endAuction(true); break;
    case 'repair': startRepair(n,b.dataset.k); refreshFiche(); break;
    case 'list': listCar(n); refreshFiche(); break;
    case 'quickList': quickList(n); break;
    case 'unlist': unlist(n); refreshFiche(); break;
    case 'deliver': deliverOrder(n); todoOpen=false; break;
    case 'buyUpg': buyUpg(id); break;
    case 'orderNew': orderNew(id); break;
    case 'ncColor': drafts['nc-'+id]=b.dataset.k; render(); break;
    case 'buyLimited': buyLimited(); break;
    case 'nego': todoOpen=false; openNego(n); render(); break;
    case 'negoAccept': negoAccept(); break;
    case 'negoCounter': negoCounter(); break;
    case 'negoGeste': negoGeste(); break;
    case 'negoCafe': negoCafe(); break;
    case 'negoEssai': negoEssai(); break;
    case 'franchise1': drafts.confirmFr=id; render(); break;
    case 'franchise0': drafts.confirmFr=null; render(); break;
    case 'franchise': switchFranchise(id); break;
    case 'raiseOk': raiseAnswer(+id,true); break;
    case 'raiseNo': raiseAnswer(+id,false); break;
    case 'negoDismiss': negoDismiss(); break;
    case 'buyDirect': todoOpen=false; buyDirect(n); break;
    case 'claim': claimObj(n); break;
    case 'skipObj': skipObj(n); break;
    case 'tradeAccept': tradeAccept(); break;
    case 'tradeRefuse': tradeRefuse(); break;
    case 'adBuy': adBuy(n); break;
    case 'adInspect': adInspect(n); break;
    case 'closeModal': auction=null; nego=null; renderModal(); render(); break;
    case 'upgrade': upgrade(); todoOpen=false; break;
    case 'rename': { const v=(drafts.garageName||'').trim(); if(v){S.garage=v; delete drafts.garageName; commit(); toast('Garage renommé.');} break; }
    case 'reset1': drafts.confirmReset=true; render(); break;
    case 'reset0': delete drafts.confirmReset; render(); break;
    case 'avatar': S.avatar=n; commit(); break;
    case 'recruit': recruit=id; renderModal(); break;
    case 'recruitClose': recruit=null; renderModal(); break;
    case 'hireOpen': hiring=n; recruit=null; delete drafts.look; renderModal(); break;
    case 'hireClose': hiring=null; recruit=id||null; delete drafts.look; renderModal(); break;
    case 'look': drafts.look=n; renderModal(); break;
    case 'hire': hire(n); break;
    case 'fire1': drafts.confirmFire=n; render(); break;
    case 'fire0': delete drafts.confirmFire; render(); break;
    case 'fire': fire(n); break;
    case 'acctOpen': acct={mode:id||'login',busy:false,error:'',info:''}; renderModal(); break;
    case 'acctClose': acct=null; renderModal(); break;
    case 'acctMode': acct={mode:id,busy:false,error:'',info:''}; renderModal(); break;
    case 'keepCloud': resolveConflict('cloud'); break;
    case 'keepLocal': resolveConflict('local'); break;
    case 'logout1': drafts.confirmLogout=true; render(); break;
    case 'logout0': delete drafts.confirmLogout; render(); break;
    case 'logout': logout(); break;
    case 'board': loadBoard(); break;
    case 'reset2': { const o=S.ownerUid, p=S.pseudo; delete drafts.confirmReset; S=freshState(); S.ownerUid=o; S.pseudo=p; seed(); ensureObjs(); auction=null; nego=null; hiring=null; recruit=null; fiche=null; renderModal(); commit(); cloudSave(true); break; }
  }
});

function seed(){ refreshLots(); S.ads=[newAd()]; S.nextAdAt=now()+60000; S.nextMonthAt=now()+MONTH; S.nextOrderAt=now()+rnd(6,9)*60000;
  log('Ouverture du garage. 15 000 € en caisse et trois places de parking.'); }
function start(data){
  S=(data&&data.S)||load();
  if(!S){S=freshState(); seed();}
  else if(!S.lotsAt){ S.lotsAt=now()+LOTS_EVERY; while(S.lots.length<lotCount()) S.lots.push(newLot()); }
  ensureObjs();
  render(); renderModal();
  fbInit();
  setInterval(tick,1000); setInterval(save,5000);
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

</script>
